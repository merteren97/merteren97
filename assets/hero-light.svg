<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="top-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0" />
      <stop offset="28%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="56%" stop-color="#00D2FF" stop-opacity="0.50" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="ambient-light" cx="28%" cy="0%" r="72%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.09" />
      <stop offset="55%" stop-color="#00D2FF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emblem-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </radialGradient>
    <pattern id="arch-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="0.6" stroke-opacity="0.7" />
    </pattern>
    <radialGradient id="grid-fade" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="grid-mask">
      <rect width="900" height="270" fill="url(#grid-fade)" />
    </mask>
    <clipPath id="hero-clip">
      <rect x="0.75" y="0.75" width="898.5" height="268.5" rx="16" />
    </clipPath>
  </defs>

  <style>
    .orbit { transform-origin: 546px 135px; animation: spin 42s linear infinite; }
    .pulse { animation: breathe 3s ease-in-out infinite; }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>

  <g clip-path="url(#hero-clip)">
    <rect x="0.75" y="0.75" width="898.5" height="268.5" rx="16" fill="url(#bg)" />
    <rect x="0" y="0" width="900" height="270" fill="url(#arch-grid)" mask="url(#grid-mask)" />
    <rect x="0" y="0" width="900" height="270" fill="url(#ambient-light)" />
    <!-- Whisper-thin top specular accent -->
    <rect x="0" y="0.75" width="900" height="1.5" fill="url(#top-sheen)" />
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="268.5" rx="16" stroke="#e2e8f0" stroke-width="1" />

  <!-- LEFT EDITORIAL COLUMN -->
  <circle cx="42" cy="40" r="3.2" fill="#10B981" class="pulse" />
  <text x="54" y="43.5" font-family="'JetBrains Mono', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4" fill="#64748b">ATRISHUB · SYSTEMS &amp; AI ARCHITECTURE</text>

  <text x="38" y="102" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.1" fill="#0f172a">E. Mert Eren</text>

  <text x="38" y="132" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="url(#brand)">Software Engineer &amp; Systems Architect</text>

  <text x="38" y="164" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569">Architecting local-first AI developer workspaces, real-time WebRTC</text>
  <text x="38" y="185" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569">platforms, and autonomous engineering tools in Rust, TypeScript &amp; Tauri.</text>

